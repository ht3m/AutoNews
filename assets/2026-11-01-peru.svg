<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260"><rect width="800" height="260" fill="#f0f4f8"/><g font-family="Microsoft YaHei,sans-serif" fill="#183146"><text x="24" y="35" font-size="21">中秘升级协定：从法令到生效</text><circle cx="40" cy="85" r="6" fill="#287a89"/><text x="64" y="90" font-size="17">10月27日　秘鲁公布确定生效日期的法令</text><circle cx="40" cy="143" r="6" fill="#287a89"/><text x="64" y="148" font-size="17">10月29日　中国商务部确认生效安排</text><circle cx="40" cy="201" r="6" fill="#287a89"/><text x="64" y="206" font-size="17">11月1日　升级议定书正式生效</text></g></svg>